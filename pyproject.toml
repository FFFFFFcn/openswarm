[project]
name = "openswarm-agent-team"
version = "0.1.0"
description = "蜂群引力AI: Xiaohongshu editorial operations workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "agentscope[full]==2.0.4",
  "fakeredis[lua]>=2.36,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "pyinstaller>=6.11,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
